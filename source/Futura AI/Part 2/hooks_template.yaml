# ═══════════════════════════════════════════
# Hermes Agent -- hooks.yaml шаблон
# Положи рядом с агентом (~/.hermes/hooks.yaml)
# Хуки -- скрипты-охранники: проверяют каждое
# действие агента ДО выполнения
# ═══════════════════════════════════════════

hooks:

  # ─── Перед действием с инструментом ───
  # Блокирует опасные команды до их выполнения
  pre_tool_call:

    # Хук 1: блокировка rm за пределами рабочей папки
    - command: "python3 hooks/block-rm.py"
      matcher: "bash"
      timeout: 30

    # Хук 2: защита критичных файлов (.env, память, конфиг)
    - command: "python3 hooks/protect-files.py"
      matcher: "bash|file_write"
      timeout: 30

  # ─── После действия с инструментом ───
  # Логирование, проверка результата
  post_tool_call:

    # Хук 3: запись всех изменений файлов в лог
    - command: "python3 hooks/audit-log.py"
      matcher: "file_write|bash"
      timeout: 10

  # ─── Перед обращением к AI-модели ───
  # Подкидывает свежие данные в контекст
  pre_llm_call:

    # Хук 4: инжекция актуального состояния системы
    - command: "bash hooks/inject-context.sh"


