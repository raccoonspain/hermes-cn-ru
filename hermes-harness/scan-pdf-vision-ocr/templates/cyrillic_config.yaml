# SUPERSEDED 2026-08-05 (D-023) — kept only for history, do not use.
#
# This file was written to work around a CWD-dependence bug that, on
# closer live verification, does not actually exist: `RapidOCR`'s
# `update_model_path()` always resolves relative Det/Cls paths against
# the package's own directory (a module constant), never against the
# calling script's CWD. `models/rapidocr-cyrillic/config.yaml` (the
# bundled config, relative Det/Cls paths and all) loads and runs
# correctly from an ordinary project directory — verified live. Use
# that file directly via `scripts/ocr_page.py --lang cyrillic`, not
# this one. Original (incorrect) rationale kept below for context only.
#
# Copy of bundled models/rapidocr-cyrillic/config.yaml with all paths
# resolved to ABSOLUTE filesystem locations instead of the bundled
# config's relative `models/...` paths.
#
# Why this matters: rapidocr resolves Det.model_path and Cls.model_path
# relative to the *current working directory* of the calling script, NOT
# relative to the config.yaml that contains them. The bundled cyrillic
# config uses `model_path: models/ch_PP-OCRv4_det_infer.onnx`, which
# resolves correctly only when CWD = the dir that contains `models/`
# (i.e. /root/.local/lib/python3.11/site-packages/rapidocr_onnxruntime/
# in this sandbox). Anywhere else, the engine silently fails to load
# Det/Cls and OCR returns nothing. Verified 2026-08-05 on a 4-page
# Cyrillic ДИ: first attempt with bundled config + default CWD returned
# 0 lines; copying the config and rewriting the three model_path /
# rec_keys_path entries as absolute paths fixed it.
#
# Usage:
#   from rapidocr_onnxruntime import RapidOCR
#   engine = RapidOCR(config_path='/path/to/this/file.yaml')
#
# The user system Python may live at different paths depending on
# whether the package was installed via system pip, --target=/some/dir,
# or via the bundled /root/.local/. Run `python3 -c "import
# rapidocr_onnxruntime; print(rapidocr_onnxruntime.__file__)"` to find
# your site-packages dir, then substitute below.

Global:
    text_score: 0.5
    use_det: true
    use_cls: true
    use_rec: true
    print_verbose: false
    min_height: 30
    width_height_ratio: 8
    max_side_len: 2000
    min_side_len: 30
    return_word_box: false

    intra_op_num_threads: &intra_nums -1
    inter_op_num_threads: &inter_nums -1

Det:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # ABSOLUTE path to Det model (ch_PP-OCRv4_det_infer.onnx) — do not
    # change to relative `models/...` unless your CWD happens to be
    # the rapidocr_onnxruntime package dir.
    model_path: /root/.local/lib/python3.11/site-packages/rapidocr_onnxruntime/models/ch_PP-OCRv4_det_infer.onnx

    limit_side_len: 736
    limit_type: min
    std: [ 0.5, 0.5, 0.5 ]
    mean: [ 0.5, 0.5, 0.5 ]

    thresh: 0.3
    box_thresh: 0.5
    max_candidates: 1000
    unclip_ratio: 1.6
    use_dilation: true
    score_mode: fast

Cls:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # ABSOLUTE path to Cls model — same caveat as Det above.
    model_path: /root/.local/lib/python3.11/site-packages/rapidocr_onnxruntime/models/ch_ppocr_mobile_v2.0_cls_infer.onnx

    cls_image_shape: [3, 48, 192]
    cls_batch_num: 6
    cls_thresh: 0.9
    label_list: ['0', '180']

Rec:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # ABSOLUTE path to bundled Cyrillic recognition model
    # (cyrillic_PP-OCRv5_mobile_rec — the model that actually reads
    # Russian; stock ch_PP-OCRv4_rec only does Chinese+English).
    model_path: /root/.hermes/skills/productivity/scan-pdf-vision-ocr/models/rapidocr-cyrillic/cyrillic_PP-OCRv5_mobile_rec_infer.onnx

    # The dict had a spurious leading blank line in the upstream repo
    # (851 lines, should be 850 — off-by-one desyncs every character
    # index against the model's 852-class output). Fixed copy, do not
    # re-download over it.
    rec_keys_path: /root/.hermes/skills/productivity/scan-pdf-vision-ocr/models/rapidocr-cyrillic/ppocrv5_cyrillic_dict.txt

    rec_img_shape: [3, 48, 320]
    rec_batch_num: 6