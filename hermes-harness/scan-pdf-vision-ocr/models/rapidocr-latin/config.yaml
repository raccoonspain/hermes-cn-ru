Global:
    text_score: 0.5
    use_det: true
    use_cls: true
    use_rec: true
    print_verbose: false
    min_height: 30
    width_height_ratio: 8
    max_side_len: 2000
    min_side_len: 30
    return_word_box: false

    # Stock Det/Rec/Cls models (Chinese+English/Latin), but with threads
    # forced to 1 instead of the package default -1/"auto" (D-023,
    # 2026-08-05). This sandbox container is capped at 1.0 vCPU (`docker
    # inspect`: NanoCpus=1e9) but `-1` makes onnxruntime spawn one thread
    # per HOST-visible core (`nproc` reports 8) — 8 threads fighting over
    # a 1-core cgroup quota. Forcing 1 thread cut a full-page OCR call
    # from 71s to 17.5s on the same image, byte-identical output. Use
    # this config (not bare `RapidOCR()`) for any non-Cyrillic document —
    # for Cyrillic use `models/rapidocr-cyrillic/config.yaml` instead.
    intra_op_num_threads: &intra_nums 1
    inter_op_num_threads: &inter_nums 1

Det:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    model_path: models/ch_PP-OCRv4_det_infer.onnx

    limit_side_len: 736
    limit_type: min
    std: [ 0.5, 0.5, 0.5 ]
    mean: [ 0.5, 0.5, 0.5 ]

    thresh: 0.3
    box_thresh: 0.5
    max_candidates: 1000
    unclip_ratio: 1.6
    use_dilation: true
    score_mode: fast

Cls:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    model_path: models/ch_ppocr_mobile_v2.0_cls_infer.onnx

    cls_image_shape: [3, 48, 192]
    cls_batch_num: 6
    cls_thresh: 0.9
    label_list: ['0', '180']

Rec:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    model_path: models/ch_PP-OCRv4_rec_infer.onnx

    rec_img_shape: [3, 48, 320]
    rec_batch_num: 6
